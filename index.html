<!DOCTYPE html>
<html lang="es">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Hesychia.Cat</title>

<link rel="stylesheet" href="style.css">

</head>


<body>


<header>

<h1>Hesychia.Cat</h1>

<p>
El silencio alimenta el alma
</p>

</header>



<section class="hero">

<h2>
Streetwear con propósito
</h2>

<p>
Prendas inspiradas en la fe, el silencio y la contemplación.
</p>

</section>




<section class="productos">

<h2>
Nuestra colección
</h2>



<div class="producto">


<img src="imagenes/camiseta1.jpg" alt="Camiseta Hesychia">


<h3>
El Silencio Alimenta el Alma
</h3>


<p>
$75.000 COP
</p>


</div>




<div class="producto">


<img src="imagenes/camiseta2.jpg" alt="Camiseta Hesychia">


<h3>
San Fransisco
</h3>


<p>
$75.000 COP
</p>


</div>


</section>






<section class="pedido">


<h2>
Realiza tu pedido
</h2>



<form onsubmit="enviarWhatsApp(); return false;">


<label>
Nombre:
</label>

<input type="text" id="nombre" required>



<label>
WhatsApp:
</label>

<input type="text" id="telefono" required>



<label>
Ciudad:
</label>

<input type="text" id="ciudad" required>



<label>
Diseño:
</label>


<select id="producto">

<option>
El Silencio Alimenta el Alma
</option>

<option>
San Fransisco
</option>

</select>




<label>
Talla:
</label>


<select id="talla">

<option>S</option>

<option>M</option>

<option>L</option>

<option>XL</option>

</select>





<label>
Cantidad:
</label>


<input type="number" id="cantidad" value="1" min="1">



<button type="submit">

Enviar pedido

</button>



</form>


</section>





<footer>

<p>
© 2026 Hesychia.Cat
</p>

</footer>




<script src="script.js"></script>


</body>

</html>
